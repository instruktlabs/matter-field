name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - run: npm test

  browser-builds:
    name: Browser bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - run: npm run probe:build
      - run: npm run probe:typegpu:build
      - run: npm run build:typegpu
      - run: npm run test:typegpu:build
      - run: npm run test:typegpu:types
      - run: npm run test:typegpu:consumer
      - run: npm run test:package
      - run: npm run bench:cpu:self-test
      - run: npm run site:build
      - run: npx playwright install --with-deps chromium
      - run: npm run site:smoke

  browser-cpu-parity:
    name: Browser and Worker CPU parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          package-manager-cache: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers
